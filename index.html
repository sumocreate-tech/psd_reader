<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>簡易PSDレイヤーエディタ（階層構造対応版）</title>
  <script src="https://unpkg.com/ag-psd/dist/bundle.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
      background-color: #1e1e1e;
      color: #e0e0e0;
      overflow: hidden;
    }
    /* 左側：キャンバスエリア */
    #canvas-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
                        linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
                        linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      overflow: auto;
      padding: 20px;
      position: relative;
    }
    canvas {
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      max-width: 100%;
      max-height: 100%;
      cursor: grab;
      display: none;
    }
    canvas:active {
      cursor: grabbing;
    }
    #welcome-message {
      text-align: center;
      color: #888;
    }
    #welcome-message h2 {
      color: #ccc;
      margin-bottom: 8px;
    }
    /* ドラッグされているときに画面全体を光らせるオーバーレイ */
    #drop-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 120, 212, 0.2);
      border: 4px dashed #007acc;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      font-weight: bold;
      z-index: 1000;
      pointer-events: none;
    }
    #status-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(200, 60, 60, 0.95);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      z-index: 10;
      max-width: 80%;
    }
    /* 右側：レイヤーパネル */
    #sidebar {
      width: 340px;
      background-color: #252526;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 12px 16px;
      background-color: #333333;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #layer-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .layer-item {
      display: flex;
      flex-direction: column;
      padding: 6px 8px;
      margin-bottom: 4px;
      background-color: #2d2d30;
      border-radius: 4px;
      border: 1px solid transparent;
      font-size: 13px;
      user-select: none;
    }
    .layer-item.folder {
      background-color: #262629;
      border-left: 3px solid #569cd6;
    }
    .layer-item.selected {
      border-color: #007acc;
      background-color: #37373d;
    }
    .layer-item.dimmed {
      opacity: 0.5;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .folder-toggle {
      width: 16px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      font-size: 10px;
    }
    .folder-toggle:hover {
      color: #fff;
    }
    .layer-icon {
      font-size: 13px;
    }
    .layer-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .layer-controls {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #3e3e42;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #bbb;
    }
    input[type="range"] {
      flex: 1;
    }
    .footer-actions {
      padding: 12px;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      background-color: #0e639c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover {
      background-color: #1177bb;
    }
    button:disabled {
      background-color: #3e3e42;
      color: #777;
      cursor: not-allowed;
    }
    button.secondary {
      background-color: #3e3e42;
    }
    button.secondary:hover {
      background-color: #4e4e52;
    }
  </style>
</head>
<body>

  <div id="drop-overlay">ここにPSDファイルをドロップしてください</div>
  <input type="file" id="file-input" accept=".psd" style="display: none;">

  <div id="canvas-container">
    <div id="status-banner"></div>
    
    <div id="welcome-message">
      <h2>PSDファイルを読み込む</h2>
      <p>この画面のどこにでも、PSDファイルをドラッグ＆ドロップしてください</p>
      <p style="font-size: 12px; color: #666; margin-top: 15px;">（または下のボタンからファイルを選択できます）</p>
      <button type="button" id="select-file-btn" class="secondary" style="margin-top: 10px; width: auto; padding: 8px 20px;">ファイルを選ぶ</button>
    </div>

    <canvas id="main-canvas"></canvas>
  </div>

  <div id="sidebar">
    <div class="panel-header">
      <span>レイヤー構造</span>
      <span id="doc-size" style="font-weight: normal; font-size: 11px; color: #aaa;"></span>
    </div>
    <div id="layer-list">
      <div style="color: #777; text-align: center; margin-top: 40px; font-size: 13px;">
        PSDを読み込むとレイヤーが表示されます
      </div>
    </div>
    <div class="footer-actions">
      <button type="button" id="change-file-btn" class="secondary">別ファイル</button>
      <button type="button" id="export-btn" disabled>PNG保存</button>
    </div>
  </div>

  <script>
    let psdData = null;
    let layerTree = [];      // 階層構造を保持するツリーデータ
    let selectedNode = null; // 選択中のノード（レイヤーまたはフォルダ）

    let isDraggingLayer = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragTargets = [];    // ドラッグ時に動かすレイヤー群（フォルダ選択時は配下すべて）

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const layerListEl = document.getElementById('layer-list');
    const exportBtn = document.getElementById('export-btn');
    const docSizeEl = document.getElementById('doc-size');
    const statusBanner = document.getElementById('status-banner');
    const welcomeMessage = document.getElementById('welcome-message');
    const dropOverlay = document.getElementById('drop-overlay');
    const fileInput = document.getElementById('file-input');
    const selectFileBtn = document.getElementById('select-file-btn');
    const changeFileBtn = document.getElementById('change-file-btn');

    function showBanner(msg, isWarning = false) {
      statusBanner.textContent = msg;
      statusBanner.style.background = isWarning ? 'rgba(200, 140, 20, 0.95)' : 'rgba(200, 60, 60, 0.95)';
      statusBanner.style.display = 'block';
    }

    // --- ボタンからのファイル選択イベント ---
    selectFileBtn.addEventListener('click', () => {
      fileInput.value = ''; // 同じファイルを再選択できるようにリセット
      fileInput.click();
    });

    changeFileBtn.addEventListener('click', () => {
      fileInput.value = '';
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        loadPsdFile(e.target.files[0]);
      }
    });

    // --- 画面全体のドラッグ＆ドロップ制御 ---
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.style.display = 'flex';
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dropOverlay.style.display = 'none';
        dragCounter = 0;
      }
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.style.display = 'none';

      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        loadPsdFile(e.dataTransfer.files[0]);
      }
    });

    // --- PSD読み込みメイン処理 ---
    async function loadPsdFile(file) {
      statusBanner.style.display = 'none';
      try {
        const buffer = await file.arrayBuffer();
        psdData = agPsd.readPsd(buffer);

        canvas.width = psdData.width;
        canvas.height = psdData.height;
        docSizeEl.textContent = `${psdData.width} × ${psdData.height}px`;

        // 階層構造（ツリー）を構築
        layerTree = buildLayerTree(psdData.children || []);

        // レイヤーが空で統合プレビューがある場合
        if (layerTree.length === 0 && psdData.canvas) {
          layerTree.push({
            type: 'layer',
            name: '統合済みプレビュー画像',
            canvas: psdData.canvas,
            left: 0,
            top: 0,
            opacity: 1,
            visible: true,
            blendMode: 'source-over'
          });
          showBanner('個別レイヤーが見つからないため、統合プレビューを表示しています', true);
        }

        welcomeMessage.style.display = 'none';
        canvas.style.display = 'block';
        exportBtn.disabled = false;
        selectedNode = null;

        renderLayerUI();
        renderCanvas();

      } catch (err) {
        showBanner('PSDの読み込みエラー: ' + err.message);
        console.error(err);
      }
    }

    // 再帰的にフォルダとレイヤーのツリー構造を作成
    function buildLayerTree(children) {
      const nodes = [];
      for (const child of children) {
        if (child.children) {
          // フォルダ（グループ）ノード
          nodes.push({
            type: 'folder',
            name: child.name || '名称未設定フォルダ',
            visible: !Boolean(child.hidden),
            opacity: child.opacity !== undefined ? child.opacity : 1,
            collapsed: false, // 折りたたみ状態
            children: buildLayerTree(child.children)
          });
        } else if (child.canvas) {
          // 通常レイヤーノード
          nodes.push({
            type: 'layer',
            name: child.name || '名称未設定レイヤー',
            canvas: child.canvas,
            left: child.left || 0,
            top: child.top || 0,
            opacity: child.opacity !== undefined ? child.opacity : 1,
            visible: !Boolean(child.hidden),
            blendMode: mapBlendMode(child.blendMode)
          });
        }
      }
      return nodes;
    }

    function mapBlendMode(psdMode) {
      const map = {
        'normal': 'source-over',
        'multiply': 'multiply',
        'screen': 'screen',
        'overlay': 'overlay',
        'darken': 'darken',
        'lighten': 'lighten',
        'color dodge': 'color-dodge',
        'color burn': 'color-burn',
        'hard light': 'hard-light',
        'soft light': 'soft-light',
        'difference': 'difference',
        'exclusion': 'exclusion'
      };
      return map[psdMode] || 'source-over';
    }

    // --- キャンバスの再描画（ツリーを下から順に走査） ---
    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawNodes(layerTree, true, 1);
    }

    function drawNodes(nodes, parentVisible, parentOpacity) {
      // ag-psdの配列は「下のレイヤーから上のレイヤー」の順で格納されている
      for (const node of nodes) {
        const currentVisible = parentVisible && node.visible;
        const currentOpacity = parentOpacity * node.opacity;

        if (!currentVisible || currentOpacity <= 0) continue;

        if (node.type === 'folder') {
          drawNodes(node.children, currentVisible, currentOpacity);
        } else if (node.type === 'layer' && node.canvas) {
          ctx.save();
          ctx.globalAlpha = currentOpacity;
          ctx.globalCompositeOperation = node.blendMode;
          ctx.drawImage(node.canvas, node.left, node.top);
          ctx.restore();
        }
      }
    }

    // --- 右側レイヤーパネルのツリーUI描画 ---
    function renderLayerUI() {
      layerListEl.innerHTML = '';
      if (layerTree.length === 0) {
        layerListEl.innerHTML = '<div style="color: #888; text-align: center; margin-top: 40px; font-size: 13px;">表示できるレイヤーがありません</div>';
        return;
      }
      appendTreeNodes(layerTree, 0, true);
    }

    function appendTreeNodes(nodes, depth, parentVisible) {
      // UI上は「上のレイヤーが上」に来るように逆順でループ
      for (let i = nodes.length - 1; i >= 0; i--) {
        const node = nodes[i];
        const isEffectiveVisible = parentVisible && node.visible;

        const item = document.createElement('div');
        item.className = 'layer-item' +
          (node.type === 'folder' ? ' folder' : '') +
          (node === selectedNode ? ' selected' : '') +
          (!isEffectiveVisible ? ' dimmed' : '');
        item.style.marginLeft = `${depth * 14}px`;

        const row = document.createElement('div');
        row.className = 'layer-row';

        // フォルダの場合は開閉ボタン（▼ / ▶）を追加
        if (node.type === 'folder') {
          const toggle = document.createElement('span');
          toggle.className = 'folder-toggle';
          toggle.textContent = node.collapsed ? '▶' : '▼';
          toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            node.collapsed = !node.collapsed;
            renderLayerUI();
          });
          row.appendChild(toggle);
        } else {
          const spacer = document.createElement('span');
          spacer.style.width = '16px';
          row.appendChild(spacer);
        }

        // 表示・非表示チェックボックス
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = node.visible;
        checkbox.addEventListener('change', (e) => {
          node.visible = e.target.checked;
          renderLayerUI();
          renderCanvas();
        });
        row.appendChild(checkbox);

        // アイコン
        const icon = document.createElement('span');
        icon.className = 'layer-icon';
        icon.textContent = node.type === 'folder' ? '📁' : '🖼️';
        row.appendChild(icon);

        // レイヤー／フォルダ名
        const nameSpan = document.createElement('span');
        nameSpan.className = 'layer-name';
        nameSpan.textContent = node.name;
        nameSpan.title = node.name;
        nameSpan.addEventListener('click', () => {
          selectedNode = (selectedNode === node) ? null : node;
          renderLayerUI();
        });
        row.appendChild(nameSpan);

        item.appendChild(row);

        // 選択中の場合、不透明度スライダーを表示（フォルダ全体の不透明度調整にも対応）
        if (node === selectedNode) {
          const controls = document.createElement('div');
          controls.className = 'layer-controls';

          const label = document.createElement('span');
          label.textContent = `不透明度: ${Math.round(node.opacity * 100)}%`;

          const slider = document.createElement('input');
          slider.type = 'range';
          slider.min = 0;
          slider.max = 1;
          slider.step = 0.01;
          slider.value = node.opacity;
          slider.addEventListener('input', (e) => {
            node.opacity = parseFloat(e.target.value);
            label.textContent = `不透明度: ${Math.round(node.opacity * 100)}%`;
            renderCanvas();
          });

          controls.appendChild(label);
          controls.appendChild(slider);
          item.appendChild(controls);
        }

        layerListEl.appendChild(item);

        // フォルダが開いている場合は子要素を再帰描画
        if (node.type === 'folder' && !node.collapsed) {
          appendTreeNodes(node.children, depth + 1, isEffectiveVisible);
        }
      }
    }

    // --- ドラッグ移動（フォルダ選択時は配下のレイヤーをまとめて移動） ---
    function collectMovableLayers(node, list = []) {
      if (!node) return list;
      if (node.type === 'layer') {
        list.push({ layer: node, startLeft: node.left, startTop: node.top });
      } else if (node.type === 'folder') {
        for (const child of node.children) {
          collectMovableLayers(child, list);
        }
      }
      return list;
    }

    canvas.addEventListener('mousedown', (e) => {
      if (!selectedNode) return;
      isDraggingLayer = true;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      dragStartX = e.clientX * scaleX;
      dragStartY = e.clientY * scaleY;
      dragTargets = collectMovableLayers(selectedNode);
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDraggingLayer || dragTargets.length === 0) return;
      const rectCanvas = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rectCanvas.width;
      const scaleY = canvas.height / rectCanvas.height;
      const dx = (e.clientX * scaleX) - dragStartX;
      const dy = (e.clientY * scaleY) - dragStartY;

      for (const target of dragTargets) {
        target.layer.left = Math.round(target.startLeft + dx);
        target.layer.top = Math.round(target.startTop + dy);
      }
      renderCanvas();
    });

    window.addEventListener('mouseup', () => {
      isDraggingLayer = false;
      dragTargets = [];
    });

    // --- PNG保存 ---
    exportBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
